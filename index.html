<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101f36">
  <title>C++ 面试练习台</title><meta name="description" content="C++ 与后端面试练习台。按模块和题型练习、自测、对照答案，支持手机和电脑使用。"><meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23122036'/%3E%3Cpath d='M25 19L12 32l13 13M39 19l13 13-13 13' fill='none' stroke='%2357e0bc' stroke-width='6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=4"><link rel="stylesheet" href="ui.css?v=4"><script src="questions.js" defer></script><script src="daily-questions.js" defer></script><script src="extra-questions-20261009.js?v=1" defer></script><script src="extra-questions-20261010.js?v=1" defer></script><script src="extra-questions-20261011.js?v=1" defer></script><script src="app.js?v=4" defer></script>
</head>
<body>
  <div class="ambient-background" aria-hidden="true"><span class="ambient-wash wash-one"></span><span class="ambient-wash wash-two"></span><span class="ambient-wash wash-three"></span><span class="ambient-grid"></span></div>
  <a class="skip" href="#question">跳到当前题目</a>
  <div class="shell">
    <aside class="sidebar" aria-label="练习模块">
      <div class="brand"><span class="brandmark" aria-hidden="true">&lt;/&gt;</span><div><strong>面试练习台</strong><span>C++ / BACKEND</span></div></div>
      <div class="private-label"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>公开练习空间</div>
      <div class="sidebar-label">知识模块</div><nav id="modules"></nav>
      <div class="sidebar-note"><span class="note-index">RECENT FOCUS</span><p>shared_ptr / STL<br>MySQL / Redis</p><span>最近反复复习的主题优先排列</span></div>
      <div class="session-note">本次进度保留在当前标签页<br>刷新后继续，关闭标签页后结束</div>
    </aside>
    <main class="main">
      <header class="page-header"><div><div class="eyebrow">C++ / 后端 · 775 道题</div><h1>面试练习台</h1></div><div class="header-actions"><button class="motion-button" id="motion-toggle" aria-pressed="true"><span class="motion-icon" aria-hidden="true"></span><span id="motion-label">动态背景已开启</span></button><button class="text-button" id="reset">重新开始本次练习</button></div></header>
      <section class="stats" aria-label="本次练习进度">
        <div class="stat"><span>已作答</span><div><strong id="completed">0</strong><span id="total">/ 775</span></div></div>
        <div class="stat"><span>待复习</span><div><strong id="review-count">0</strong><span>题</span></div></div>
        <div class="stat"><span>最近自测</span><div><strong id="score">—</strong><span id="score-label">尚未交卷</span></div></div>
        <div class="progress-stat"><div><span>本次练习完成度</span><strong id="percentage">0%</strong></div><progress id="progress" max="775" value="0" aria-label="题库作答进度"></progress><span class="muted">写下答案或完成自测后计入</span></div>
      </section>
      <section class="toolbar" aria-label="练习方式和题型筛选">
        <div class="mode-tabs" role="tablist" aria-label="练习模式"><button id="practice-tab" role="tab" aria-selected="true" aria-controls="workspace">逐题练习</button><button id="exam-tab" role="tab" aria-selected="false" aria-controls="workspace">十题自测</button></div>
        <button class="secondary mobile-filter-toggle" id="mobile-filter-toggle" aria-expanded="false" aria-controls="search-panel type-source-filters">筛选 · 775 题</button>
        <div class="filters" id="type-source-filters"><label for="source-filter">来源</label><select id="source-filter"><option value="全部">全部来源</option><option value="基础">基础题库</option></select><label for="type-filter">题型</label><select id="type-filter"><option value="全部">全部题型</option><option>概念题</option><option>场景题</option><option>代码题</option></select><span id="filter-count">775 题</span></div>
      </section>
      <section class="search-row" id="search-panel" aria-label="题目搜索和练习状态筛选"><div class="search-field"><label for="question-search">搜索题目</label><div class="search-input-wrap"><span class="search-icon" aria-hidden="true"></span><input id="question-search" type="search" maxlength="120" autocomplete="off" placeholder="shared_ptr、MVCC、Outbox…"></div></div><div class="status-field"><label for="status-filter">练习状态</label><select id="status-filter"><option value="all">全部状态</option><option value="pending">未作答</option><option value="answered">已作答</option><option value="review">待复习</option></select></div><button class="secondary" id="clear-all-filter">清除筛选</button></section>
      <div class="workspace" id="workspace" role="tabpanel" aria-labelledby="practice-tab">
        <section class="question-list" aria-label="题目列表"><div class="list-header"><h2 id="list-title">全部题目</h2><span id="list-subtitle">按题型挑选，逐题练习</span><button class="secondary mobile-list-toggle" id="mobile-list-toggle" aria-expanded="false" aria-controls="question-items">展开列表</button></div><div id="question-items"></div></section>
        <section class="question-detail" id="question" aria-label="当前题目" tabindex="-1"></section>
      </div>
      <footer><span>先独立表达，再对照答案。</span><span>作答仅保留在你当前浏览器的标签页；刷新可继续练习。</span></footer>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="confirm-dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><p id="dialog-text"></p><div class="dialog-actions"><button id="cancel-dialog" class="secondary">取消</button><button id="confirm-dialog-action" class="primary">确认</button></div></dialog>
  <noscript><p class="noscript">练习工具需要启用 JavaScript 才能作答和记录进度。</p></noscript>
</body>
</html>
